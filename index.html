ssage" role="status">正在读取链接…</p><noscript>请使用开启 JavaScript 的系统浏览器打开本链接。</noscript><form id="entry" hidden><label for="link">完整链接或阅读密钥</label><input id="link" autocomplete="off" autocapitalize="off" spellcheck="false"><button>打开课程</button></form><button id="again" hidden>重新加载</button></main><script>"use strict";
const banner=document.getElementById("message"), form=document.getElementById("entry");
function show(text,ask=false){banner.textContent=text;form.hidden=!ask}
async function openLesson(){
  const encoded=new URLSearchParams(location.hash.slice(1)).get("k");
  if(!encoded||!/^[A-Za-z0-9_-]{43}$/.test(encoded)){show("请打开含阅读密钥的完整链接，或在下方粘贴它。",true);return}
  if(!window.crypto?.subtle){show("当前浏览器无法解密课程。请用 Safari 或系统浏览器打开完整链接。");return}
  show("正在加载课程…");
  let response;
  try { response=await fetch("./lesson-2d8ca63b00edf951.bin",{referrerPolicy:"no-referrer"}); if(!response.ok)throw Error(); }
  catch {show("课程下载未完成，请在网络恢复后重试。");document.getElementById("again").hidden=false;return}
  try {
    const data=new Uint8Array(await response.arrayBuffer());
    const raw=Uint8Array.from(atob(encoded.replace(/-/g,"+").replace(/_/g,"/")+"="),s=>s.charCodeAt(0));
    const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    const result=await crypto.subtle.decrypt({name:"AES-GCM",iv:data.slice(0,12)},key,data.slice(12));
    const frame=document.createElement("iframe");
    frame.title="交互学习工作台";
    frame.addEventListener("load",()=>{document.getElementById("unlock").hidden=true;frame.focus()},{once:true});
    const target=new URLSearchParams(location.hash.slice(1)).get("p")||"";
    const route=/^course[/](?:recursion|[0-9]{1,2}[/][0-9]{1,2})$/.test(target)?"#"+target:"";
    frame.src=URL.createObjectURL(new Blob([result],{type:"text/html;charset=utf-8"}))+route;
    document.body.appendChild(frame);
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  } catch {show("密钥不匹配，或课程下载不完整。请重新打开原始链接。",true)}
}
form.addEventListener("submit",e=>{
  e.preventDefault();
  const v=document.getElementById("link").value.trim();
  const params=new URLSearchParams(v.includes("#")?v.slice(v.indexOf("#")+1):"");
  const k=v.includes("#")?params.get("k")||"":v;
  if(!/^[A-Za-z0-9_-]{43}$/.test(k)){show("请粘贴完整链接，保留 #k= 后面的全部字符。",true);return}
  const dest=new URLSearchParams({k});
  if(params.has("p"))dest.set("p",params.get("p"));
  location.replace("#"+dest);location.reload();
});
document.getElementById("again").onclick=()=>location.reload();
openLesson();</script></body></html>
